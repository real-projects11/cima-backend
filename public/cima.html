<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5">
<title>cima. — tuyo hasta que alguien pague más</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
  :root{
    --bg:#050505;
    --white:#111214;
    --line:#33363B;
    --line-soft:#26282C;
    --text:#E7E9EC;
    --text-soft:#9FA5AB;
    --text-faint:#6A6F75;
    --ink:#E7E9EC;
    --ink-dark:#FFFFFF;
    --silver:#C7CDD2;
    --silver-dark:#9DA5AC;
    --silver-mid:#B0B7BD;
    --neutral-tint:#1B1D21;
    --disabled-bg:#1C1E22;
    --disabled-text:#54585D;
    --r1:#FFD966; --r1-bg:#FFCE33; --r1-tint:#2A2408;
    --r2:#F5D97A; --r2-bg:#F1CE5B; --r2-tint:#2A230C;
    --r3:#E8D6A0; --r3-bg:#E3CE83; --r3-tint:#2B2718;
    --r4:#DAD5BC; --r4-bg:#D5CEAA; --r4-tint:#2B2820;
    --r5:#C7CDD2; --r5-bg:#C7CDD2; --r5-tint:#26282B;
    --glow-silver:0 0 22px -4px rgba(199,205,210,.55);
    --shadow-card:0 1px 2px rgba(0,0,0,.4);
    --shadow-sheet:0 -8px 30px rgba(0,0,0,.6);
    --shadow-pop:0 12px 32px rgba(0,0,0,.5);
    font-family:'Inter',sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{background:var(--bg);color:var(--text);min-height:100vh;-webkit-font-smoothing:antialiased;}
  h1,h2,h3{font-family:'Inter',sans-serif;}
  .mono{font-family:'IBM Plex Mono',monospace;}
  a{color:inherit;text-decoration:none;}
  button{font-family:inherit;cursor:pointer;background:none;border:none;}
  input,textarea{font-family:inherit;}
  ::selection{background:var(--silver-mid);color:#0B0B0D;}

  #app{max-width:600px;margin:0 auto;min-height:100vh;position:relative;padding-bottom:8px;z-index:1;}
  .bg-canvas{position:fixed;inset:0;width:100vw;height:100vh;z-index:0;display:block;background:#050505;opacity:0;transition:opacity 1.15s cubic-bezier(.22,1,.36,1);}
  .bg-canvas.is-visible{opacity:1;}

  .fade-in{animation:fadeIn .28s ease both;}
  @keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}

  /* ============ LANDING ============ */
  .meta-row{display:flex;align-items:center;justify-content:space-between;padding:18px 20px 8px;font-size:12.5px;color:var(--text-soft);}
  .meta-row a:hover{color:var(--text);}

  .brand-row{display:flex;align-items:center;justify-content:center;gap:9px;padding:14px 20px 14px;}
  .brand-mark{width:32px;height:32px;border-radius:9px;background:linear-gradient(135deg,#E7E9EB,#AEB5BB);display:flex;align-items:center;justify-content:center;flex:none;box-shadow:0 0 16px -3px rgba(199,205,210,.65);}
  .brand-mark svg{width:17px;height:17px;color:#20242A;}
  .brand-name{font-size:25px;font-weight:800;letter-spacing:-0.02em;color:var(--text);}
  .brand-name .dot{color:var(--ink);}

  .live-pill{display:flex;align-items:center;justify-content:center;gap:7px;font-size:13.5px;color:var(--text-soft);padding:0 20px 18px;}
  .dot-pulse{width:7px;height:7px;border-radius:50%;background:var(--silver-mid);position:relative;flex:none;}
  .dot-pulse::after{content:'';position:absolute;inset:-4px;border-radius:50%;border:1px solid var(--silver-mid);animation:pulse 1.8s ease-out infinite;}
  @keyframes pulse{0%{transform:scale(.6);opacity:.85}100%{transform:scale(2.4);opacity:0}}

  .toggle-row{display:flex;justify-content:center;padding-bottom:22px;}
  .toggle-group{display:inline-flex;background:var(--white);border-radius:100px;padding:4px;box-shadow:var(--shadow-card);border:1px solid var(--line-soft);}
  .toggle-opt{padding:8px 18px;font-size:13px;font-weight:600;color:var(--text-soft);border-radius:100px;display:flex;align-items:center;gap:6px;}
  .toggle-opt.active{background:var(--bg);color:var(--text);}

  .hero{padding:0 22px 22px;text-align:center;}
  .hero h1{font-size:24px;line-height:1.32;font-weight:800;letter-spacing:-0.01em;margin-bottom:22px;}
  .hero h1 em{font-style:normal;color:var(--ink);}

  .stepper-hero{display:flex;align-items:center;justify-content:center;gap:18px;margin-bottom:20px;}
  .step-circle{width:42px;height:42px;border-radius:50%;background:var(--white);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:600;color:var(--text-soft);flex:none;transition:transform .1s ease, background .15s ease;}
  .step-circle:active{transform:scale(.92);background:var(--line-soft);}
  .stepper-hero .amt{font-size:34px;font-weight:800;color:var(--ink);display:flex;align-items:baseline;gap:6px;}
  .stepper-hero .amt .cur{font-size:14px;color:var(--text-faint);font-weight:600;}

  .cta-primary{width:100%;padding:16px 18px;border:none;border-radius:100px;background:linear-gradient(135deg,#E7E9EB,#AEB5BB);color:#14171A;font-size:15px;font-weight:800;box-shadow:0 0 30px -4px rgba(199,205,210,.6);transition:transform .12s ease, background .15s ease, box-shadow .15s ease;}
  .cta-primary:hover{background:linear-gradient(135deg,#D8DBDE,#9DA5AC);box-shadow:0 0 40px -2px rgba(199,205,210,.8);}
  .cta-primary:active{transform:scale(.985);}

  .secure-row{display:flex;align-items:center;justify-content:center;gap:6px;font-size:12px;color:var(--text-faint);margin-top:14px;}
  .secure-row svg{width:13px;height:13px;}

  .occupant-line{font-size:12.5px;color:var(--text-faint);text-align:center;padding:16px 22px 8px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .occupant-line b{color:var(--text-soft);font-weight:600;}

  .rank-list{padding:6px 14px 0;display:flex;flex-direction:column;gap:12px;}
  .rank-card{background:var(--white);border:1.5px solid var(--line);border-radius:16px;padding:14px 15px;box-shadow:var(--shadow-card);transition:transform .12s ease, box-shadow .12s ease;}
  .rank-card:hover{border-color:var(--silver-mid);box-shadow:var(--glow-silver);}
  .rank-card:hover{transform:translateY(-2px);box-shadow:0 6px 16px rgba(20,23,26,.07);}
  .r1{border-color:var(--r1-bg);animation:gold-pulse 3s ease-in-out infinite;}
  @keyframes gold-pulse{0%,100%{box-shadow:0 0 14px -6px rgba(255,206,51,.35);}50%{box-shadow:0 0 24px -4px rgba(255,206,51,.7);}}
  .r2{border-color:var(--r2-bg);}
  .r3{border-color:var(--r3-bg);}
  .r4{border-color:var(--r4-bg);}
  .r5{border-color:var(--r5-bg);}

  .rank-head{display:flex;align-items:center;gap:8px;margin-bottom:9px;}
  .badge{position:relative;overflow:hidden;border-radius:8px;padding:4px 9px;font-weight:800;font-size:13px;color:#fff;flex:none;}
  .badge::after{content:'';position:absolute;top:0;left:-60%;width:45%;height:100%;background:linear-gradient(115deg,transparent,rgba(255,255,255,.85),transparent);animation:badge-shine 3.2s ease-in-out infinite;}
  @keyframes badge-shine{0%{left:-60%;}55%{left:130%;}100%{left:130%;}}
  .r1 .badge{background:var(--r1-bg);color:#5B3D08;}
  .r2 .badge{background:var(--r2-bg);color:#5B4A0C;}
  .r3 .badge{background:var(--r3-bg);color:#4A4530;}
  .r4 .badge{background:var(--r4-bg);color:#3F3D3A;}
  .r5 .badge{background:var(--r5-bg);color:#33363A;}
  .coin-ico{width:19px;height:19px;border-radius:50%;background:var(--r1-tint);display:flex;align-items:center;justify-content:center;flex:none;}
  .coin-ico svg{width:11px;height:11px;color:var(--r1);}
  .platform-ico{width:19px;height:19px;color:var(--text-faint);flex:none;}
  .platform-ico svg{width:100%;height:100%;}
  .time-ago{font-size:12px;color:var(--text-faint);}
  .rank-head-spacer{flex:1;}
  .rank-price-mini{text-align:right;}
  .rank-price-mini .amt{font-weight:800;font-size:15px;color:var(--ink);}
  .rank-clicks{display:flex;align-items:center;justify-content:flex-end;gap:4px;font-size:11px;color:var(--text-faint);margin-top:1px;}
  .rank-clicks .dot{width:5px;height:5px;border-radius:50%;background:#D9705A;}

  .rank-title{font-size:15.5px;font-weight:700;margin-bottom:3px;letter-spacing:-0.005em;}
  .ticker-tag{display:inline-block;font-size:11px;font-weight:800;color:var(--r1);background:var(--r1-tint);padding:1px 7px;border-radius:100px;vertical-align:middle;}
  .rank-desc{font-size:13px;color:var(--text-soft);line-height:1.42;margin-bottom:11px;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;}
  .rank-bottom{display:flex;align-items:center;justify-content:space-between;padding-top:10px;border-top:1px solid var(--line-soft);}
  .rank-url{font-size:12px;color:var(--text-faint);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .rank-visit{font-size:13px;font-weight:700;display:flex;align-items:center;gap:4px;flex:none;}
  .r1 .rank-visit{color:var(--r1);} .r2 .rank-visit{color:var(--r2);} .r3 .rank-visit{color:var(--r3);} .r4 .rank-visit{color:var(--r4);} .r5 .rank-visit{color:var(--r5);}
  .rank-visit svg{width:13px;height:13px;}

  .status-tag{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;padding:3px 9px;border-radius:100px;margin-bottom:10px;}
  .status-protected{background:var(--neutral-tint);color:var(--ink);}
  .status-soon{background:#FCEEDD;color:#A05A0C;}
  .displace-btn{width:100%;display:flex;align-items:center;justify-content:center;gap:7px;padding:13px;border-radius:12px;font-weight:800;font-size:14px;margin-bottom:12px;transition:transform .12s ease, filter .12s ease;}
  .displace-btn:hover{filter:brightness(.96);}
  .displace-btn:active{transform:scale(.985);}
  .displace-btn svg{width:15px;height:15px;}

  .rank-card.neutral{border-color:var(--line);}
  .rank-card.neutral .badge{background:#DCDFD8;color:#4A4D50;}
  .rank-card.neutral .amt{color:var(--text);}
  .rank-card.neutral .rank-visit{color:var(--text);}

  .section-head{display:flex;align-items:center;gap:10px;padding:30px 20px 12px;}
  .section-head span{font-size:12px;color:var(--text-faint);font-weight:700;letter-spacing:.06em;text-transform:uppercase;}
  .section-head .line{flex:1;height:1px;background:var(--line);}

  .others-list{padding:0 14px;display:flex;flex-direction:column;gap:9px;}
  .other-row{background:var(--white);border:1px solid var(--line);border-radius:13px;display:flex;align-items:center;gap:11px;padding:11px 13px;box-shadow:var(--shadow-card);}
  .other-ico{width:30px;height:30px;border-radius:9px;background:var(--bg);display:flex;align-items:center;justify-content:center;flex:none;color:var(--text-soft);}
  .other-ico svg{width:14px;height:14px;}
  .other-mid{flex:1;min-width:0;}
  .other-name{font-size:13.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .other-url{font-size:11.5px;color:var(--text-faint);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .other-arrow{color:var(--text-faint);flex:none;}
  .other-arrow svg{width:15px;height:15px;}

  .view-all{display:block;width:calc(100% - 28px);margin:16px 14px 0;padding:14px;text-align:center;font-size:13.5px;font-weight:700;color:var(--text-soft);background:var(--white);border:1px solid var(--line);border-radius:100px;box-shadow:var(--shadow-card);}
  .view-all b{color:var(--text);}

  .footer{padding:38px 24px 24px;text-align:center;}
  .footer-tag{font-size:13px;color:var(--text-soft);margin-bottom:14px;font-weight:500;}
  .footer-links{display:flex;justify-content:center;gap:18px;font-size:13px;margin-bottom:18px;}
  .footer-links a.pub{color:var(--ink);font-weight:700;}
  .footer-links a{color:var(--text-faint);}
  .footer-legal{font-size:11.5px;color:var(--text-faint);line-height:1.65;max-width:460px;margin:0 auto;}
  .footer-legal a{color:var(--text-soft);text-decoration:underline;}

  /* ============ WIZARD PAGES ============ */
  .wiz-topbar{display:flex;align-items:center;justify-content:center;position:relative;padding:18px 20px;}
  .wiz-back{position:absolute;left:16px;display:flex;align-items:center;gap:5px;font-size:14px;font-weight:600;color:var(--text-soft);padding:6px;}
  .wiz-back svg{width:16px;height:16px;}
  .wiz-brand{display:flex;align-items:center;gap:7px;font-size:16px;font-weight:800;}
  .wiz-brand .mark{width:22px;height:22px;border-radius:6px;background:linear-gradient(135deg,#E7E9EB,#AEB5BB);display:flex;align-items:center;justify-content:center;}
  .wiz-brand .mark svg{width:12px;height:12px;color:#20242A;}

  .wiz-head{display:flex;align-items:flex-start;justify-content:space-between;padding:6px 20px 16px;}
  .wiz-head-left{display:flex;gap:11px;align-items:flex-start;}
  .wiz-head-ico{width:34px;height:34px;border-radius:9px;background:var(--neutral-tint);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;flex:none;}
  .wiz-head-ico svg{width:17px;height:17px;color:var(--ink);}
  .wiz-head h2{font-size:17px;font-weight:800;margin-bottom:2px;}
  .wiz-head .sub{font-size:12.5px;color:var(--text-soft);}
  .progress-dots{display:flex;gap:5px;padding-top:8px;flex:none;}
  .progress-dots i{width:16px;height:6px;border-radius:100px;background:var(--line);display:block;transition:all .2s ease;}
  .progress-dots i.active{width:30px;background:var(--ink);}
  .progress-dots i.done{background:var(--silver-mid);}

  .confirm-row{margin:0 16px 10px;background:var(--white);border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;align-items:center;gap:10px;box-shadow:var(--shadow-card);}
  .confirm-check{width:19px;height:19px;border-radius:50%;background:var(--neutral-tint);display:flex;align-items:center;justify-content:center;flex:none;}
  .confirm-check svg{width:11px;height:11px;color:var(--ink);}
  .confirm-mid{flex:1;min-width:0;}
  .confirm-label{font-size:10.5px;color:var(--text-faint);font-weight:700;letter-spacing:.05em;text-transform:uppercase;margin-bottom:1px;}
  .confirm-val{font-size:13.5px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .confirm-change{font-size:12.5px;font-weight:700;color:var(--ink);flex:none;}

  .wiz-card{margin:8px 16px 0;background:var(--white);border-radius:20px;box-shadow:var(--shadow-pop);padding:22px 20px 20px;}
  .wiz-card h3{font-size:19px;font-weight:800;margin-bottom:5px;letter-spacing:-0.01em;}
  .wiz-card .desc{font-size:13px;color:var(--text-soft);margin-bottom:20px;line-height:1.5;}

  .dest-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:18px;}
  .dest-opt{border:1.5px solid var(--line);border-radius:14px;padding:17px 10px;display:flex;flex-direction:column;align-items:center;gap:9px;font-size:13.5px;font-weight:700;color:var(--text-soft);transition:all .12s ease;}
  .dest-opt svg{width:22px;height:22px;}
  .dest-opt.active{border-color:var(--ink);background:var(--neutral-tint);color:var(--ink);}
  .dest-opt:not(.active):hover{border-color:var(--text-faint);}

  .field{margin-bottom:16px;}
  .field-label{display:flex;justify-content:space-between;font-size:12.5px;color:var(--text-soft);font-weight:600;margin-bottom:8px;}
  .field-label .count{color:var(--text-faint);font-weight:500;}
  .input-wrap{display:flex;align-items:center;background:var(--bg);border:1.5px solid transparent;border-radius:12px;overflow:hidden;transition:border-color .12s ease;}
  .input-wrap:focus-within{border-color:var(--ink);background:var(--white);}
  .input-prefix{padding:13px 0 13px 14px;font-size:13.5px;color:var(--ink);font-weight:600;white-space:nowrap;}
  input[type=text],textarea{width:100%;background:transparent;border:none;outline:none;color:var(--text);padding:13px 14px;font-size:13.5px;}
  textarea{resize:none;min-height:66px;line-height:1.5;}
  .field-hint{font-size:11.5px;color:var(--text-faint);margin-top:6px;}

  .btn{width:100%;padding:15px;border-radius:100px;font-size:14.5px;font-weight:700;border:none;background:var(--disabled-bg);color:var(--disabled-text);transition:all .15s ease;}
  .btn.enabled{background:var(--ink);color:#0B0B0D;box-shadow:var(--glow-silver);}
  .btn.enabled:hover{background:var(--silver-dark);}
  .btn.enabled:active{transform:scale(.985);}
  .btn-outline{background:var(--white);border:1.5px solid var(--line);color:var(--text);}
  .btn-row{display:flex;gap:10px;}
  .btn-row .btn{flex:1;}

  .prev-card{border:2px solid var(--r1-bg);border-radius:16px;padding:14px 15px;margin-bottom:20px;background:var(--white);}
  .preview-caption{font-size:12px;color:var(--text-faint);margin-bottom:10px;}

  .amount-panel{background:var(--bg);border-radius:14px;padding:16px;margin-bottom:8px;}
  .amount-panel-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;}
  .amount-panel-head span{font-size:13px;font-weight:700;color:var(--text-soft);}
  .amount-panel-head .range{font-size:11.5px;color:var(--text-faint);}
  .stepper-row{display:flex;align-items:center;justify-content:space-between;}
  .stepper-row .amt{font-size:24px;font-weight:800;color:var(--ink);}
  .stepper-note{font-size:12.5px;color:var(--text-soft);text-align:center;margin:14px 0 18px;}
  .stepper-note b{color:var(--ink);}

  .slot-picker{display:flex;gap:8px;margin-bottom:16px;overflow-x:auto;}
  .slot-chip{flex:none;min-width:70px;padding:10px 6px;border-radius:12px;text-align:center;border:1.5px solid var(--line);}
  .slot-chip .r{font-weight:800;font-size:13.5px;margin-bottom:2px;}
  .slot-chip .p{font-size:10.5px;color:var(--text-faint);}
  .slot-chip.active{border-color:var(--ink);background:var(--neutral-tint);}
  .slot-chip.active .r{color:var(--ink);}

  /* confirm bottom sheet (dimmed overlay) */
  .dim-overlay{position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:60;display:flex;align-items:flex-end;justify-content:center;animation:fadeIn .18s ease;}
  @media (min-width:640px){.dim-overlay{align-items:center;}}
  .sheet{width:100%;max-width:520px;background:var(--white);border-radius:22px 22px 0 0;padding:24px 22px 26px;box-shadow:var(--shadow-sheet);animation:slideUp .22s cubic-bezier(.2,.8,.2,1);}
  @media (min-width:640px){.sheet{border-radius:22px;}}
  @keyframes slideUp{from{transform:translateY(30px);opacity:0}to{transform:translateY(0);opacity:1}}
  .sheet h2{font-size:19px;font-weight:800;line-height:1.35;margin-bottom:16px;}
  .sheet h2 .g{color:var(--ink);}
  .check-row{display:flex;gap:11px;align-items:flex-start;margin-bottom:18px;border:1.5px solid var(--line);padding:13px 14px;border-radius:14px;}
  .check-row input{margin-top:2px;flex:none;width:17px;height:17px;accent-color:var(--ink);}
  .check-row label{font-size:12.5px;color:var(--text-soft);line-height:1.5;}
  .check-row a{color:var(--ink);font-weight:600;text-decoration:underline;}
  .sheet-cancel{display:block;text-align:center;font-size:13.5px;color:var(--text-faint);font-weight:600;margin-top:14px;padding:6px;}

  /* checkout page */
  .network-badge{display:inline-flex;align-items:center;gap:7px;background:#FCEEDD;color:#8A4B00;font-size:14.5px;font-weight:800;padding:9px 16px;border-radius:11px;margin:0 auto 16px;border:1.5px solid #F0B23D;}
  .network-badge svg{width:16px;height:16px;flex:none;}
  .network-row{display:flex;justify-content:center;}
  .qr-box{background:#fff;border:1.5px solid var(--line);padding:14px;border-radius:16px;width:176px;height:176px;margin:4px auto 18px;display:flex;align-items:center;justify-content:center;}
  .qr-box canvas,.qr-box img{width:100% !important;height:100% !important;}
  .amount-big{text-align:center;margin-bottom:14px;}
  .amount-big .n{font-family:'IBM Plex Mono',monospace;font-size:27px;font-weight:600;color:var(--ink);}
  .amount-big .c{font-size:12px;color:var(--text-faint);display:block;margin-top:3px;}
  .warn-note{font-size:12px;color:#A05A0C;background:#FCEEDD;border-radius:12px;padding:11px 13px;text-align:center;margin-bottom:16px;line-height:1.5;font-weight:500;}

  .alt-contact-x svg{width:15px;height:15px;}

  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--white);border:1px solid var(--line);color:var(--ink);padding:11px 18px;border-radius:100px;font-size:13px;font-weight:600;z-index:100;box-shadow:var(--glow-silver);animation:toastIn .2s ease;}
  @keyframes toastIn{from{opacity:0;transform:translate(-50%,10px)}to{opacity:1;transform:translate(-50%,0)}}
</style>

<script>

  whatsapp: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a10 10 0 00-8.6 15L2 22l5.2-1.4A10 10 0 1012 2zm0 18.1a8 8 0 01-4.1-1.1l-.3-.2-3.1.8.8-3-.2-.3A8.1 8.1 0 1120 12a8 8 0 01-8 8.1zm4.4-6c-.2-.1-1.4-.7-1.7-.8s-.4-.1-.6.1-.7.8-.9 1-.3.2-.6.1a6.6 6.6 0 01-3.3-2.9c-.2-.4.2-.4.6-1.2.1-.2 0-.4 0-.5s-.6-1.5-.9-2-.5-.5-.6-.5h-.5c-.2 0-.5.1-.7.3a2.6 2.6 0 00-.8 2c0 1.2.9 2.3 1 2.5.1.2 1.7 2.7 4.2 3.7.6.3 1 .4 1.4.5.6.2 1.1.2 1.5.1.5-.1 1.4-.6 1.6-1.1s.2-1 .1-1.1-.2-.2-.4-.3z"/></svg>',
  telegram: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M21.9 4.5L2.8 11.9c-1 .4-1 1.6.1 1.9l4.6 1.5 1.8 5.5c.2.7 1 1 1.6.5l2.7-2.2 4.9 3.6c.7.5 1.7.1 1.9-.7l3-14.8c.2-1-.7-1.8-1.5-1.7zM8.6 14.6l8.6-6.3c.3-.2.6.1.3.4l-7 6.7-.3 3.6-1.6-4.4z"/></svg>',
  mail: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="M4 7l8 6 8-6"/></svg>'
};
const PLATFORM_ICON = { instagram:'instagram', x:'x', listado:'coin', link:'link' };

/* ============================================================
   CONEXIÓN AL BACKEND
   Si deployaste cima-backend en Vercel, pegá esa URL acá abajo
   (sin barra al final), ej: 'https://cima-backend.vercel.app'.
   Si dejás '' y este html vive DENTRO de ese mismo proyecto
   (carpeta /public), los fetch funcionan igual con ruta relativa.
   ============================================================ */
const API_BASE = '';
const WALLET_ADDRESS = 'TXn9ZqP4mKk2vRw8fLc3sYb7hJd5uNa1Qe'; // wallet USDT TRC20 real

async function apiFetch(path, opts){
  const res = await fetch(API_BASE + path, {
    headers: { 'Content-Type': 'application/json' },
    ...opts,
  });
  const data = await res.json().catch(()=>({}));
  if(!res.ok) throw new Error(data.error || 'Error de conexión con el backend');
  return data;
}

function emptyPosition(rank){
  return { rank, occupied:false, name:null, desc:null, platform:null, url:null, link:null, cta:null,
    price:null, paidAt:null, protectedHoursLeft:0, minToDisplace: starts[rank], startPrice: starts[rank],
    locked:false, lockStatus:null };
}

function agoLabel(paidAtMs){
  if(!paidAtMs) return '';
  const h = (Date.now() - Number(paidAtMs)) / 3600000;
  if(h < 1) return 'recién';
  if(h < 24) return `hace ${Math.floor(h)} h`;
  return `hace ${Math.floor(h/24)} d`;
}

const increments = {1:100, 2:70, 3:50, 4:35, 5:20};
const starts = {1:500, 2:350, 3:250, 4:175, 5:100};

// Arranca sin nada — los 5 puestos se muestran "libres" hasta que loadPositions()
// traiga el estado real del backend (o hasta que alguien los compre de verdad).
let projects = [1,2,3,4,5].map(emptyPosition);

// "También publicados" (#6+) todavía no tiene backend propio — arranca vacío también.
const others = [];

/* NOTA: "others" (#6 en adelante) sigue siendo mock — el backend actual solo
   maneja los 5 puestos pagos del top. Cuando sumemos la sección de "listado
   libre" del prompt original, esto se conecta igual que loadPositions(). */
async function loadPositions(){
  try{
    const data = await apiFetch('/api/positions');
    if(data && Array.isArray(data.positions)){
      projects = data.positions.map(p => ({
        ...p,
        ago: p.paidAt ? agoLabel(p.paidAt) : null,
        clicks: p.clicks ?? (p.price ? Math.round(p.price * 13) + 24 : 0),
      }));
    }
    if(typeof data.totalPublished === 'number'){
      totalPublished = data.totalPublished;
    }
  } catch(err){
    console.warn('No se pudo cargar el estado real de los puestos:', err.message);
  }
}

let watching = 14;
// Arranca en 0 y se va rellenando solo con publicaciones reales confirmadas
// (lo trae loadPositions() del backend) — nada de números inventados.
let totalPublished = 0;
let timeFilter = 'historico';
let showAllPositions = false;

let state = {
  view: 'landing',
  wizard: { platform:'instagram', handle:'', link:'', ticker:'', title:'', desc:'', btnText:'', slot:1, bid: starts[1] },
  showConfirm: false,
  reservation: null
};

function minToDisplace(p){ if(!p || p.occupied === false || p.price == null) return starts[p.rank]; return Math.round((p.price + increments[p.rank])*100)/100; }
function fmt(n){ return n.toLocaleString('es-AR',{minimumFractionDigits:2, maximumFractionDigits:2}); }
function fmt6(n){ return n.toFixed(6); }
function esc(s){ return (s||'').replace(/[&<>"']/g, c=>({'&':'&lt;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]||c)); }
function domainFor(platform){ return platform==='instagram' ? 'instagram.com/' : platform==='x' ? 'x.com/' : platform==='youtube' ? 'youtube.com/@' : ''; }
function destinationUrl(p){
  if(p.link){
    return /^https?:\/\//i.test(p.link) ? p.link : `https://${p.link}`;
  }
  if(!p.url) return '#';
  if(/^https?:\/\//i.test(p.url)) return p.url;
  return `https://${domainFor(p.platform)}${p.url}`;
}

function statusTag(p){
  if(p.protectedHoursLeft > 24){
    return `<div class="status-tag status-protected">Protegido · ${Math.round(p.protectedHoursLeft)}h restantes</div>`;
  } else if(p.protectedHoursLeft > 0){
    const h = Math.floor(p.protectedHoursLeft), m = Math.round((p.protectedHoursLeft-h)*60);
    return `<div class="status-tag status-soon">Disponible en ${h}h ${m}m</div>`;
  } else {
    const price = p.minToDisplace ?? minToDisplace(p);
    return `<button class="displace-btn" style="background:var(--r${p.rank}-tint);color:var(--r${p.rank})" data-open-slot="${p.rank}">Desplazar por $${fmt(price)} ${ICONS.arrow}</button>`;
  }
}

function rankCardHTML(p){
  if(p.occupied === false){
    const price = p.minToDisplace ?? starts[p.rank];
    return `
    <div class="rank-card r${p.rank}">
      <div class="rank-head">
        <div class="badge">#${p.rank}</div>
        <div class="rank-head-spacer"></div>
      </div>
      <div class="rank-title">Puesto libre</div>
      <div class="rank-desc">Todavía nadie lo tomó. Sé el primero en publicar acá.</div>
      <button class="displace-btn" style="background:var(--r${p.rank}-tint);color:var(--r${p.rank})" data-open-slot="${p.rank}">Publicarlo por $${fmt(price)} ${ICONS.arrow}</button>
    </div>`;
  }
  return `
  <div class="rank-card r${p.rank}" style="cursor:pointer" data-open-link="${esc(destinationUrl(p))}">

      <div class="badge">#${p.rank}</div>

      <div class="rank-price-mini">

        <div class="rank-clicks"><span class="dot"></span>~${p.clicks} clicks</div>
      </div>
    </div>
    ${statusTag(p)}
    <div class="rank-title">${esc(p.name)} ${p.ticker ? `<span class="ticker-tag">$${esc(p.ticker)}</span>` : ""}</div>
    <div class="rank-desc">${esc(p.desc)}</div>
    <div class="rank-bottom">
      <div class="rank-url">${esc(p.url)}</div>
      <a class="rank-visit" href="${destinationUrl(p)}" target="_blank" rel="noopener noreferrer">${esc(p.cta)} ${ICONS.arrow}</a>
    </div>
  </div>`;
}

function otherCardHTML(p){
  return `
  <div class="rank-card neutral" style="cursor:pointer" data-open-link="${esc(destinationUrl(p))}">
    <div class="rank-head">
      <div class="badge">#${p.rank}</div>
      <div class="platform-ico">${ICONS[PLATFORM_ICON[p.platform]]}</div>
      <div class="coin-ico">${ICONS.coin}</div>
      <div class="time-ago">hace ${p.ago}</div>
      <div class="rank-head-spacer"></div>
      <div class="rank-price-mini">
        <div class="amt">$${fmt(p.price)}</div>
        <div class="rank-clicks"><span class="dot"></span>~${p.clicks} clicks</div>
      </div>
    </div>
    <div class="rank-title">${esc(p.name)} ${p.ticker ? `<span class="ticker-tag">$${esc(p.ticker)}</span>` : ""}</div>

    <div class="rank-bottom">
      <div class="rank-url">${esc(p.url)}</div>

    </div>
  </div>`;
}

function landingHTML(){
  const p1 = projects[0];
  const nextMin = minToDisplace(p1);
  const bidVal = state.heroBid || nextMin;
  return `
  <div class="meta-row">
    <a href="https://x.com/geo_ecom" target="_blank" rel="noopener noreferrer">por @geo_ecom</a>
    <a href="#">¿Qué es esto?</a>
    <a href="#">@cima.online</a>
  </div>

    <button class="cta-primary" data-action="open-wizard" data-slot="1">Llévate el puesto #1 por $${fmt(bidVal)}</button>

  <div class="occupant-line">${p1.occupied !== false ? `${esc(p1.url)} <b>en #1 hace ${p1.ago}</b>` : 'El puesto #1 está libre — sé el primero en tomarlo.'}</div>

  <div class="rank-list">${projects.map(rankCardHTML).join('')}</div>

  <button class="view-all" id="view-all-btn">Ver todos los puestos <b>${totalPublished.toLocaleString('es-AR')}</b></button>
  ${showAllPositions ? `
  <div class="section-head" id="all-positions-head"><span>Todos los puestos</span><div class="line"></div><span>${totalPublished.toLocaleString('es-AR')} en juego</span></div>
  ${others.length ? `<div class="rank-list">${others.map(otherCardHTML).join('')}</div>` : `<div class="occupant-line" style="padding:20px 22px;">Todavía no hay proyectos publicados acá. Vas a ser el primero.</div>`}
  ` : ''}

  <div class="footer">
    <div class="footer-tag">cima. — tuyo hasta que alguien pague más</div>
    <div class="footer-links">
      <a href="#" class="pub" data-action="open-wizard-any">Publicar tu proyecto</a>
      <a href="#">Términos</a>
      <a href="https://x.com/geo_ecom" target="_blank" rel="noopener noreferrer">@geo_ecom</a>
    </div>
    <div class="footer-legal">
      cima. es un experimento para memecoins. Los puestos se compran y se pierden: cualquiera puede desplazarte pagando más. Nada de lo publicado acá está revisado ni recomendado por cima. Comprar un puesto no garantiza tráfico ni resultados. Si tuviste un problema, <a href="#">mandanos un DM</a>.
    </div>
  </div>`;
}

/* ---------- WIZARD SHELL ---------- */
function wizTopbar(backAction){
  return `
  <div class="wiz-topbar">
    <button class="wiz-back" data-action="${backAction}">${ICONS.chevleft} Volver</button>
    <div class="wiz-brand"><div class="mark">${ICONS.peak}</div>cima.</div>
  </div>`;
}
function wizHead(title, sub, step){
  const dots = [1,2,3].map(i=>`<i class="${i<step?'done':i===step?'active':''}"></i>`).join('');
  return `
  <div class="wiz-head">
    <div class="wiz-head-left">
      <div class="wiz-head-ico">${ICONS.peak}</div>
      <div><h2>${title}</h2><div class="sub">${sub}</div></div>
    </div>
    <div class="progress-dots">${dots}</div>
  </div>`;
}
function confirmRow(label, value){
  return `
  <div class="confirm-row">
    <div class="confirm-check">${ICONS.check}</div>
    <div class="confirm-mid">
      <div class="confirm-label">${label}</div>
      <div class="confirm-val">${value}</div>
    </div>

}

function destOptHTML(key, label, iconKey){
  const active = state.wizard.platform === key ? 'active' : '';
  return `<button class="dest-opt ${active}" data-platform="${key}">${ICONS[iconKey]}<span>${label}</span></button>`;
}

function wizardStep1HTML(){
  const w = state.wizard;
  const domain = domainFor(w.platform);
  const isLink = w.platform === 'link';
  const isListado = w.platform === 'listado';
  const handleLabel = isLink ? 'URL de tu proyecto' : isListado ? 'Dónde está listada' : 'Usuario';
  const handlePlaceholder = isLink ? 'tuproyecto.com' : isListado ? 'pump.fun' : 'tuproyecto';
  const ready = w.platform && w.handle;
  return `
  ${wizTopbar('close-wizard')}
  ${wizHead('Armá tu cima', 'Primero: a dónde los llevás', 1)}
  <div class="wiz-card fade-in">
    <h3>¿A dónde los mandás?</h3>
    <div class="desc">El que toque tu cima cae acá. De ahí sacamos tu iconito.</div>
    <div class="dest-grid">
      ${destOptHTML('instagram','Instagram','instagram')}
      ${destOptHTML('x','X','x')}
      ${destOptHTML('listado','Listado en','coin')}
      ${destOptHTML('link','Link externo','link')}
    </div>
    <div class="field">
      <div class="field-label"><span>${handleLabel}</span></div>
      <div class="input-wrap">
        ${domain ? `<span class="input-prefix">${domain}</span>` : ''}
        <input type="text" id="handle-input" placeholder="${handlePlaceholder}" value="${esc(w.handle)}">
      </div>
    </div>
    <button class="btn ${ready?'enabled':''}" id="step1-next" ${!ready?'disabled':''}>Listo, sigamos</button>
  </div>
  ${footerMini()}`;
}

function wizardStep2HTML(){
  const w = state.wizard;
  const ready = w.title && w.desc && w.btnText && w.ticker;
  return `
  ${wizTopbar('wizard-goto-1')}
  ${wizHead('Armá tu cima', 'Ahora: qué van a leer', 2)}
  ${confirmRow('LOS MANDAS A', domainFor(w.platform) + esc(w.handle))}
  <div class="wiz-card fade-in">
    <h3>¿Qué querés que diga?</h3>
    <div class="desc">Un título y una línea. Las que te harían tocar a vos.</div>
    <div class="field">
      <div class="field-label"><span>Ticker</span><span class="count">${w.ticker.length}/6</span></div>
      <div class="desc" style="margin:-2px 0 8px;">Las 6 letras con las que se abrevia tu cripto donde está listada.</div>
      <div class="input-wrap"><input type="text" id="ticker-input" maxlength="6" placeholder="PEPE" value="${esc(w.ticker)}" style="text-transform:uppercase;"></div>
    </div>

      <div class="field-label"><span>Título</span><span class="count">${w.title.length}/40</span></div>

    </div>
    <div class="field">
      <div class="field-label"><span>Una línea más</span><span class="count">${w.desc.length}/110</span></div>
      <div class="desc" style="margin:-2px 0 8px;">Una línea de descripción corta de tu proyecto.</div>
      <div class="input-wrap"><textarea id="desc-input" maxlength="110" placeholder="La próxima gema de Solana. Presale abierta, liquidez bloqueada.">${esc(w.desc)}</textarea></div>
    </div>
    <div class="field">
      <div class="field-label"><span>Texto del botón</span><span class="count">${w.btnText.length}/20</span></div>
      <div class="input-wrap"><input type="text" id="btn-input" maxlength="20" placeholder="Comprar ahora" value="${esc(w.btnText)}"></div>
    </div>
    <div class="btn-row">
      <button class="btn btn-outline" data-action="wizard-goto-1">Atrás</button>
      <button class="btn ${ready?'enabled':''}" id="step2-next" ${!ready?'disabled':''}>Mostrame cómo queda</button>
    </div>
  </div>
  ${footerMini()}`;

function render(){
  const app = document.getElementById('app');
  if(state.view === 'landing'){
    app.innerHTML = landingHTML();
    attachLandingEvents();
    return;
  }
  if(state.view === 'w1') app.innerHTML = wizardStep1HTML();
  else if(state.view === 'w2') app.innerHTML = wizardStep2HTML();
  else if(state.view === 'w3') app.innerHTML = wizardStep3HTML();
  else if(state.view === 'checkout') app.innerHTML = checkoutHTML();
  attachWizardEvents();

  if(state.view === 'w3' && state.showConfirm){
    app.insertAdjacentHTML('beforeend', confirmSheetHTML());
    attachConfirmEvents();
  }
  if(state.view === 'checkout' && state.reservation && state.reservation.status === 'pending'){
    setupCheckout();
  }
  if(state.view === 'checkout' && state.reservation && state.reservation.status === 'waiting'){
    setupWaitingPoll();
  }
}

  }
  const step1Next = document.getElementById('step1-next');

    if(tickerInput) w.ticker = tickerInput.value.toUpperCase();
    if(titleInput) w.title = titleInput.value;
    if(descInput) w.desc = descInput.value;
    if(btnInput) w.btnText = btnInput.value;

    if(next){ next.disabled = !ready; next.classList.toggle('enabled', !!ready); }
    const counts = document.querySelectorAll('.field .count');
    const lens = [w.ticker.length, w.title.length, w.desc.length, w.btnText.length];
    const maxes = [6,40,110,20];
    counts.forEach((c,i)=>{ c.textContent = lens[i] + '/' + maxes[i]; });

  [tickerInput, titleInput, descInput, btnInput].forEach(el=>{ if(el) el.addEventListener('input', syncStep2); });

  if(bidPlus) bidPlus.addEventListener('click', ()=>{ w.bid = Math.round((w.bid + step())*100)/100; refreshBid(); });

function attachConfirmEvents(){
  const w = state.wizard;
  const overlay = document.getElementById('dim-overlay');
  overlay.addEventListener('click', (e)=>{ if(e.target === overlay){ state.showConfirm=false; render(); } });
  document.querySelectorAll('[data-action="close-confirm"]').forEach(el=> el.addEventListener('click', (e)=>{ e.preventDefault(); state.showConfirm=false; render(); }));
  const disclaimerCheck = document.getElementById('disclaimer-check');
  const goPayBtn = document.getElementById('go-pay-btn');
  disclaimerCheck.addEventListener('change', ()=>{
    goPayBtn.disabled = !disclaimerCheck.checked;
    goPayBtn.classList.toggle('enabled', disclaimerCheck.checked);
  });
  goPayBtn.addEventListener('click', async ()=>{
    if(goPayBtn.disabled) return;
    goPayBtn.disabled = true;
    goPayBtn.textContent = 'Reservando...';
    try{
      const result = await apiFetch(`/api/positions/${w.slot}/reserve`, {
        method:'POST',
        body: JSON.stringify({
          platform: w.platform, handle: w.handle, link: w.link, ticker: w.ticker, title: w.title, desc: w.desc, btnText: w.btnText,
          contact: w.handle, bid: w.bid,
        }),
      });
      if(result.status === 'queued'){
        state.reservation = { slot: w.slot, status:'queued', reservationId: result.reservationId, queuePosition: result.queuePosition };
      } else {
        state.reservation = { slot: w.slot, status:'pending', reservationId: result.reservationId, amount: result.amount, expiresAt: result.expiresAt };
      }
      state.view = 'checkout';
      state.showConfirm = false;
      render();
    } catch(err){
      showToast(err.message || 'No se pudo reservar el puesto');
      goPayBtn.disabled = false;
      goPayBtn.classList.add('enabled');
      goPayBtn.textContent = `Ir a pagar $${fmt(w.bid)}`;
    }
  });

function setupCheckout(){
  const r = state.reservation;
  const qrContainer = document.getElementById('qr-container');
  if(qrContainer && window.QRCode){
    qrContainer.innerHTML = '';
    new QRCode(qrContainer, { text: `tron:${WALLET_ADDRESS}?amount=${r.amount.toFixed(6)}&token=USDT`, width: 148, height: 148, colorDark: '#14171A', colorLight: '#ffffff' });
  }
  const copyBtn = document.getElementById('copy-wallet-btn');
  if(copyBtn) copyBtn.addEventListener('click', ()=>{
    navigator.clipboard && navigator.clipboard.writeText(WALLET_ADDRESS).catch(()=>{});
    copyBtn.classList.add('copied');
    copyBtn.innerHTML = ICONS.check;
    showToast('Dirección copiada');
    setTimeout(()=>{ copyBtn.classList.remove('copied'); copyBtn.innerHTML = ICONS.copy; }, 1800);
  });
  const timerDisplay = document.getElementById('timer-display');
  clearInterval(timerInterval);
  function tick(){
    // El TTL real vive en el backend (Redis); acá solo mostramos la cuenta regresiva
    // en base a expiresAt, que es lo que el servidor nos devolvió al reservar.
    const secondsLeft = r.expiresAt ? Math.max(0, Math.round((r.expiresAt - Date.now())/1000)) : 0;
    if(secondsLeft <= 0){
      clearInterval(timerInterval);
      showToast('El tiempo para pagar venció');
      closeAll();
      return;
    }
    const m = Math.floor(secondsLeft/60), s = secondsLeft%60;
    if(timerDisplay) timerDisplay.textContent = `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
  }
  tick();
  timerInterval = setInterval(tick, 1000);
}

/* Mientras el usuario está en "esperando confirmación", chequeamos cada 5s si
   el admin ya confirmó (o rechazó) SU reserva puntual — sin que tenga que
   recargar nada. Si se confirma, lo mandamos a la página principal a ver su
   puesto ya publicado. */
function setupWaitingPoll(){
  const r = state.reservation;
  clearInterval(waitingPollInterval);
  async function check(){
    try{
      const result = await apiFetch(`/api/positions/${r.slot}/status?reservationId=${encodeURIComponent(r.reservationId)}`);
      if(result.status === 'confirmed'){
        clearInterval(waitingPollInterval);
        window.location.href = '/';
      } else if(result.status === 'not_found'){
        clearInterval(waitingPollInterval);
        showToast('Tu reserva fue rechazada o venció. Podés intentar de nuevo.');
        closeAll();
      }
    } catch(err){
      // si falla una consulta puntual no pasa nada, se reintenta sola en el próximo tick
    }
  }
  check();
  waitingPollInterval = setInterval(check, 5000);
}

function showToast(msg){

  const t = document.createElement('div');
  t.className = 'toast';
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(()=> t.remove(), 2600);
}

/* ============================================================
   FONDO ANIMADO POR SCROLL (misma técnica que "fuego criollo")
   Un canvas fijo detrás de todo el contenido dibuja un frame
   distinto según cuánto scrolleaste. Si no hay frames cargados
   en la carpeta correspondiente, se pinta negro sólido — no
   rompe nada, el sitio se ve exactamente igual que ahora.

   CÓMO CARGAR TUS FRAMES:
   1) Convertí tus 2 videos a secuencias de imágenes .webp
      (mismo nombre que usa fuego criollo: frame_0001.webp, frame_0002.webp, etc.)
   2) Subilas a:
        /public/frames/bg-desktop/   → versión horizontal, para pantallas anchas
        /public/frames/bg-mobile/    → versión vertical, para celular
   3) Cambiá TOTAL_FRAMES_DESKTOP y TOTAL_FRAMES_MOBILE acá abajo
      por la cantidad real de frames que generaste en cada carpeta.
   Mientras TOTAL_FRAMES sea 0 (o falten los archivos), se ve negro sólido.
   ============================================================ */
(function(){
  const DESKTOP_BREAKPOINT = 860; // mismo criterio que fuego criollo
  const TOTAL_FRAMES_DESKTOP = 0; // <-- poné acá la cantidad real de frames (ej: 180)
  const TOTAL_FRAMES_MOBILE = 0;  // <-- poné acá la cantidad real de frames (ej: 180)

  const isDesktop = window.innerWidth >= DESKTOP_BREAKPOINT;
  const CARPETA = isDesktop ? 'frames/bg-desktop' : 'frames/bg-mobile';
  const TOTAL_FRAMES = isDesktop ? TOTAL_FRAMES_DESKTOP : TOTAL_FRAMES_MOBILE;

  const canvas = document.getElementById('bgCanvas');
  if(!canvas) return;
  const ctx = canvas.getContext('2d');

  let hasFrames = TOTAL_FRAMES > 0;
  const images = new Array(TOTAL_FRAMES);
  let currentFrame = 0;

  /* ---- Autoplay lento cuando nadie toca la pantalla ----
     En cuanto el usuario scrollea/arrastra (con el dedo, mouse wheel, etc.)
     el frame pasa a seguir 1:1 el scroll, a la velocidad que el usuario
     mueva el dedo. Si se queda quieto un rato, retoma el autoplay lento
     desde el frame en el que quedó. */
  const AUTOPLAY_MS_POR_FRAME = 110; // más alto = autoplay más lento
  const IDLE_PARA_RETOMAR = 900;     // ms sin scroll para retomar el autoplay
  let lastInteraction = -Infinity;
  let autoplayDir = 1;
  let autoplayAccum = 0;
  let lastTs = null;

  function nombreFrame(i){
    return `${CARPETA}/frame_${String(i + 1).padStart(4, '0')}.webp`;
  }

  function pintarNegro(){
    ctx.fillStyle = '#050505';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
  }

  function dibujar(indice){
    if(!hasFrames){ pintarNegro(); return; }
    const img = images[indice];
    if(!img || !img.complete || !img.naturalWidth){ pintarNegro(); return; }
    const cw = canvas.width, ch = canvas.height;
    const iw = img.naturalWidth, ih = img.naturalHeight;
    const scale = Math.max(cw / iw, ch / ih); // cover, sin deformar
    const dw = iw * scale, dh = ih * scale;
    const dx = (cw - dw) / 2, dy = (ch - dh) / 2;
    pintarNegro();
    ctx.drawImage(img, dx, dy, dw, dh);
  }

  function mostrarCanvas(){
    // Fade-in elegante una vez que hay algo (frame real o negro) para mostrar
    requestAnimationFrame(() => canvas.classList.add('is-visible'));
  }

  function precargar(){
    if(!hasFrames){ mostrarCanvas(); return; }
    for(let i = 0; i < TOTAL_FRAMES; i++){
      const img = new Image();
      if(i === 0){
        img.onerror = () => { hasFrames = false; pintarNegro(); mostrarCanvas(); };
        img.onload = () => { dibujar(currentFrame); mostrarCanvas(); };
      }
      img.src = nombreFrame(i);
      images[i] = img;
    }
  }

  function resize(){
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    dibujar(currentFrame);
  }

  function actualizarPorScroll(){
    if(!hasFrames){ pintarNegro(); return; }
    const max = document.documentElement.scrollHeight - window.innerHeight;
    const progreso = max > 0 ? Math.min(1, Math.max(0, window.scrollY / max)) : 0;
    currentFrame = Math.min(TOTAL_FRAMES - 1, Math.round(progreso * (TOTAL_FRAMES - 1)));
    dibujar(currentFrame);
  }

  function onInteraccion(){
    lastInteraction = performance.now();
    actualizarPorScroll();
  }

  function pasoAutoplay(ts){
    requestAnimationFrame(pasoAutoplay);
    if(!hasFrames || TOTAL_FRAMES <= 1) return;

    const enReposo = (ts - lastInteraction) > IDLE_PARA_RETOMAR;
    if(!enReposo){ lastTs = null; autoplayAccum = 0; return; }

    if(lastTs == null){ lastTs = ts; return; } // primer frame en reposo, no saltar
    const dt = ts - lastTs;
    lastTs = ts;
    autoplayAccum += dt;

    if(autoplayAccum >= AUTOPLAY_MS_POR_FRAME){
      const pasos = Math.floor(autoplayAccum / AUTOPLAY_MS_POR_FRAME);
      autoplayAccum -= pasos * AUTOPLAY_MS_POR_FRAME;
      currentFrame += pasos * autoplayDir;
      if(currentFrame >= TOTAL_FRAMES - 1){ currentFrame = TOTAL_FRAMES - 1; autoplayDir = -1; }
      if(currentFrame <= 0){ currentFrame = 0; autoplayDir = 1; }
      dibujar(currentFrame);
    }
  }

  window.addEventListener('resize', resize, { passive: true });
  window.addEventListener('scroll', onInteraccion, { passive: true });
  resize();
  precargar();
  actualizarPorScroll();
  requestAnimationFrame(pasoAutoplay);
})();

loadPositions().then(render);
</script>
</body>
</html>
