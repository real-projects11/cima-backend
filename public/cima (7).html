<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5">
<title>cima. — tuyo hasta que alguien pague más</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
  :root{
    --bg:#EDEFEB;
    --white:#FFFFFF;
    --line:#E2E4DE;
    --line-soft:#EAEBE6;
    --text:#14171A;
    --text-soft:#6B7075;
    --text-faint:#9CA0A6;
    --green:#12664F;
    --green-dark:#0D4F3D;
    --green-mid:#1C8F6E;
    --green-tint:#E4F1EC;
    --disabled-bg:#DDDFD9;
    --disabled-text:#A2A6A0;
    --r1:#B4790C; --r1-bg:#F0B23D; --r1-tint:#FBF1DD;
    --r2:#146B52; --r2-bg:#1C8F6E; --r2-tint:#E3F1EC;
    --r3:#1C7A94; --r3-bg:#2B99B4; --r3-tint:#E2F1F4;
    --r4:#6947B8; --r4-bg:#8467D6; --r4-tint:#EEEAFA;
    --r5:#B34A25; --r5-bg:#CC6440; --r5-tint:#FAEAE3;
    --shadow-card:0 1px 2px rgba(20,23,26,.04);
    --shadow-sheet:0 -8px 30px rgba(20,23,26,.18);
    --shadow-pop:0 12px 32px rgba(20,23,26,.08);
    font-family:'Inter',sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{background:var(--bg);color:var(--text);min-height:100vh;-webkit-font-smoothing:antialiased;}
  h1,h2,h3{font-family:'Inter',sans-serif;}
  .mono{font-family:'IBM Plex Mono',monospace;}
  a{color:inherit;text-decoration:none;}
  button{font-family:inherit;cursor:pointer;background:none;border:none;}
  input,textarea{font-family:inherit;}
  ::selection{background:var(--green-mid);color:#fff;}

  #app{max-width:600px;margin:0 auto;min-height:100vh;position:relative;padding-bottom:8px;}

  .fade-in{animation:fadeIn .28s ease both;}
  @keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}

  /* ============ LANDING ============ */
  .meta-row{display:flex;align-items:center;justify-content:space-between;padding:18px 20px 8px;font-size:12.5px;color:var(--text-soft);}
  .meta-row a:hover{color:var(--text);}

  .brand-row{display:flex;align-items:center;justify-content:center;gap:9px;padding:14px 20px 14px;}
  .brand-mark{width:32px;height:32px;border-radius:9px;background:var(--green);display:flex;align-items:center;justify-content:center;flex:none;}
  .brand-mark svg{width:17px;height:17px;color:#fff;}
  .brand-name{font-size:25px;font-weight:800;letter-spacing:-0.02em;color:var(--text);}
  .brand-name .dot{color:var(--green);}

  .live-pill{display:flex;align-items:center;justify-content:center;gap:7px;font-size:13.5px;color:var(--text-soft);padding:0 20px 18px;}
  .dot-pulse{width:7px;height:7px;border-radius:50%;background:var(--green-mid);position:relative;flex:none;}
  .dot-pulse::after{content:'';position:absolute;inset:-4px;border-radius:50%;border:1px solid var(--green-mid);animation:pulse 1.8s ease-out infinite;}
  @keyframes pulse{0%{transform:scale(.6);opacity:.85}100%{transform:scale(2.4);opacity:0}}

  .toggle-row{display:flex;justify-content:center;padding-bottom:22px;}
  .toggle-group{display:inline-flex;background:var(--white);border-radius:100px;padding:4px;box-shadow:var(--shadow-card);border:1px solid var(--line-soft);}
  .toggle-opt{padding:8px 18px;font-size:13px;font-weight:600;color:var(--text-soft);border-radius:100px;display:flex;align-items:center;gap:6px;}
  .toggle-opt.active{background:var(--bg);color:var(--text);}

  .hero{padding:0 22px 22px;text-align:center;}
  .hero h1{font-size:24px;line-height:1.32;font-weight:800;letter-spacing:-0.01em;margin-bottom:22px;}
  .hero h1 em{font-style:normal;color:var(--green);}

  .stepper-hero{display:flex;align-items:center;justify-content:center;gap:18px;margin-bottom:20px;}
  .step-circle{width:42px;height:42px;border-radius:50%;background:var(--white);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:600;color:var(--text-soft);flex:none;transition:transform .1s ease, background .15s ease;}
  .step-circle:active{transform:scale(.92);background:var(--line-soft);}
  .stepper-hero .amt{font-size:34px;font-weight:800;color:var(--green);display:flex;align-items:baseline;gap:6px;}
  .stepper-hero .amt .cur{font-size:14px;color:var(--text-faint);font-weight:600;}

  .cta-primary{width:100%;padding:16px 18px;border:none;border-radius:100px;background:var(--green);color:#fff;font-size:15px;font-weight:700;box-shadow:0 8px 18px -6px rgba(18,102,79,.5);transition:transform .12s ease, background .15s ease;}
  .cta-primary:hover{background:var(--green-dark);}
  .cta-primary:active{transform:scale(.985);}

  .secure-row{display:flex;align-items:center;justify-content:center;gap:6px;font-size:12px;color:var(--text-faint);margin-top:14px;}
  .secure-row svg{width:13px;height:13px;}

  .occupant-line{font-size:12.5px;color:var(--text-faint);text-align:center;padding:16px 22px 8px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .occupant-line b{color:var(--text-soft);font-weight:600;}

  .rank-list{padding:6px 14px 0;display:flex;flex-direction:column;gap:12px;}
  .rank-card{background:var(--white);border:1.5px solid var(--line);border-radius:16px;padding:14px 15px;box-shadow:var(--shadow-card);transition:transform .12s ease, box-shadow .12s ease;}
  .rank-card:hover{transform:translateY(-2px);box-shadow:0 6px 16px rgba(20,23,26,.07);}
  .r1{border-color:var(--r1-bg);}
  .r2{border-color:var(--r2-bg);}
  .r3{border-color:var(--r3-bg);}
  .r4{border-color:var(--r4-bg);}
  .r5{border-color:var(--r5-bg);}

  .rank-head{display:flex;align-items:center;gap:8px;margin-bottom:9px;}
  .badge{border-radius:8px;padding:4px 9px;font-weight:800;font-size:13px;color:#fff;flex:none;}
  .r1 .badge{background:var(--r1-bg);color:#5B3D08;}
  .r2 .badge{background:var(--r2-bg);}
  .r3 .badge{background:var(--r3-bg);}
  .r4 .badge{background:var(--r4-bg);}
  .r5 .badge{background:var(--r5-bg);}
  .coin-ico{width:19px;height:19px;border-radius:50%;background:var(--green-tint);display:flex;align-items:center;justify-content:center;flex:none;}
  .coin-ico svg{width:11px;height:11px;color:var(--green);}
  .platform-ico{width:19px;height:19px;color:var(--text-faint);flex:none;}
  .platform-ico svg{width:100%;height:100%;}
  .time-ago{font-size:12px;color:var(--text-faint);}
  .rank-head-spacer{flex:1;}
  .rank-price-mini{text-align:right;}
  .rank-price-mini .amt{font-weight:800;font-size:15px;}
  .r1 .amt{color:var(--r1);} .r2 .amt{color:var(--r2);} .r3 .amt{color:var(--r3);} .r4 .amt{color:var(--r4);} .r5 .amt{color:var(--r5);}
  .rank-clicks{display:flex;align-items:center;justify-content:flex-end;gap:4px;font-size:11px;color:var(--text-faint);margin-top:1px;}
  .rank-clicks .dot{width:5px;height:5px;border-radius:50%;background:#D9705A;}

  .rank-title{font-size:15.5px;font-weight:700;margin-bottom:3px;letter-spacing:-0.005em;}
  .rank-desc{font-size:13px;color:var(--text-soft);line-height:1.42;margin-bottom:11px;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;}
  .rank-bottom{display:flex;align-items:center;justify-content:space-between;padding-top:10px;border-top:1px solid var(--line-soft);}
  .rank-url{font-size:12px;color:var(--text-faint);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .rank-visit{font-size:13px;font-weight:700;display:flex;align-items:center;gap:4px;flex:none;}
  .r1 .rank-visit{color:var(--r1);} .r2 .rank-visit{color:var(--r2);} .r3 .rank-visit{color:var(--r3);} .r4 .rank-visit{color:var(--r4);} .r5 .rank-visit{color:var(--r5);}
  .rank-visit svg{width:13px;height:13px;}

  .status-tag{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;padding:3px 9px;border-radius:100px;margin-bottom:10px;}
  .status-protected{background:var(--green-tint);color:var(--green);}
  .status-soon{background:#FCEEDD;color:#A05A0C;}
  .displace-btn{width:100%;display:flex;align-items:center;justify-content:center;gap:7px;padding:13px;border-radius:12px;font-weight:800;font-size:14px;margin-bottom:12px;transition:transform .12s ease, filter .12s ease;}
  .displace-btn:hover{filter:brightness(.96);}
  .displace-btn:active{transform:scale(.985);}
  .displace-btn svg{width:15px;height:15px;}

  .rank-card.neutral{border-color:var(--line);}
  .rank-card.neutral .badge{background:#DCDFD8;color:var(--text-soft);}
  .rank-card.neutral .amt{color:var(--text);}
  .rank-card.neutral .rank-visit{color:var(--text);}

  .section-head{display:flex;align-items:center;gap:10px;padding:30px 20px 12px;}
  .section-head span{font-size:12px;color:var(--text-faint);font-weight:700;letter-spacing:.06em;text-transform:uppercase;}
  .section-head .line{flex:1;height:1px;background:var(--line);}

  .others-list{padding:0 14px;display:flex;flex-direction:column;gap:9px;}
  .other-row{background:var(--white);border:1px solid var(--line);border-radius:13px;display:flex;align-items:center;gap:11px;padding:11px 13px;box-shadow:var(--shadow-card);}
  .other-ico{width:30px;height:30px;border-radius:9px;background:var(--bg);display:flex;align-items:center;justify-content:center;flex:none;color:var(--text-soft);}
  .other-ico svg{width:14px;height:14px;}
  .other-mid{flex:1;min-width:0;}
  .other-name{font-size:13.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .other-url{font-size:11.5px;color:var(--text-faint);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .other-arrow{color:var(--text-faint);flex:none;}
  .other-arrow svg{width:15px;height:15px;}

  .view-all{display:block;width:calc(100% - 28px);margin:16px 14px 0;padding:14px;text-align:center;font-size:13.5px;font-weight:700;color:var(--text-soft);background:var(--white);border:1px solid var(--line);border-radius:100px;box-shadow:var(--shadow-card);}
  .view-all b{color:var(--text);}

  .footer{padding:38px 24px 24px;text-align:center;}
  .footer-tag{font-size:13px;color:var(--text-soft);margin-bottom:14px;font-weight:500;}
  .footer-links{display:flex;justify-content:center;gap:18px;font-size:13px;margin-bottom:18px;}
  .footer-links a.pub{color:var(--green);font-weight:700;}
  .footer-links a{color:var(--text-faint);}
  .footer-legal{font-size:11.5px;color:var(--text-faint);line-height:1.65;max-width:460px;margin:0 auto;}
  .footer-legal a{color:var(--text-soft);text-decoration:underline;}

  /* ============ WIZARD PAGES ============ */
  .wiz-topbar{display:flex;align-items:center;justify-content:center;position:relative;padding:18px 20px;}
  .wiz-back{position:absolute;left:16px;display:flex;align-items:center;gap:5px;font-size:14px;font-weight:600;color:var(--text-soft);padding:6px;}
  .wiz-back svg{width:16px;height:16px;}
  .wiz-brand{display:flex;align-items:center;gap:7px;font-size:16px;font-weight:800;}
  .wiz-brand .mark{width:22px;height:22px;border-radius:6px;background:var(--green);display:flex;align-items:center;justify-content:center;}
  .wiz-brand .mark svg{width:12px;height:12px;color:#fff;}

  .wiz-head{display:flex;align-items:flex-start;justify-content:space-between;padding:6px 20px 16px;}
  .wiz-head-left{display:flex;gap:11px;align-items:flex-start;}
  .wiz-head-ico{width:34px;height:34px;border-radius:9px;background:var(--green);display:flex;align-items:center;justify-content:center;flex:none;}
  .wiz-head-ico svg{width:17px;height:17px;color:#fff;}
  .wiz-head h2{font-size:17px;font-weight:800;margin-bottom:2px;}
  .wiz-head .sub{font-size:12.5px;color:var(--text-soft);}
  .progress-dots{display:flex;gap:5px;padding-top:8px;flex:none;}
  .progress-dots i{width:16px;height:6px;border-radius:100px;background:var(--line);display:block;transition:all .2s ease;}
  .progress-dots i.active{width:30px;background:var(--green);}
  .progress-dots i.done{background:var(--green-mid);}

  .confirm-row{margin:0 16px 10px;background:var(--white);border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;align-items:center;gap:10px;box-shadow:var(--shadow-card);}
  .confirm-check{width:19px;height:19px;border-radius:50%;background:var(--green-tint);display:flex;align-items:center;justify-content:center;flex:none;}
  .confirm-check svg{width:11px;height:11px;color:var(--green);}
  .confirm-mid{flex:1;min-width:0;}
  .confirm-label{font-size:10.5px;color:var(--text-faint);font-weight:700;letter-spacing:.05em;text-transform:uppercase;margin-bottom:1px;}
  .confirm-val{font-size:13.5px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .confirm-change{font-size:12.5px;font-weight:700;color:var(--green);flex:none;}

  .wiz-card{margin:8px 16px 0;background:var(--white);border-radius:20px;box-shadow:var(--shadow-pop);padding:22px 20px 20px;}
  .wiz-card h3{font-size:19px;font-weight:800;margin-bottom:5px;letter-spacing:-0.01em;}
  .wiz-card .desc{font-size:13px;color:var(--text-soft);margin-bottom:20px;line-height:1.5;}

  .dest-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:18px;}
  .dest-opt{border:1.5px solid var(--line);border-radius:14px;padding:17px 10px;display:flex;flex-direction:column;align-items:center;gap:9px;font-size:13.5px;font-weight:700;color:var(--text-soft);transition:all .12s ease;}
  .dest-opt svg{width:22px;height:22px;}
  .dest-opt.active{border-color:var(--green);background:var(--green-tint);color:var(--green);}
  .dest-opt:not(.active):hover{border-color:var(--text-faint);}

  .field{margin-bottom:16px;}
  .field-label{display:flex;justify-content:space-between;font-size:12.5px;color:var(--text-soft);font-weight:600;margin-bottom:8px;}
  .field-label .count{color:var(--text-faint);font-weight:500;}
  .input-wrap{display:flex;align-items:center;background:var(--bg);border:1.5px solid transparent;border-radius:12px;overflow:hidden;transition:border-color .12s ease;}
  .input-wrap:focus-within{border-color:var(--green);background:var(--white);}
  .input-prefix{padding:13px 0 13px 14px;font-size:13.5px;color:var(--green);font-weight:600;white-space:nowrap;}
  input[type=text],textarea{width:100%;background:transparent;border:none;outline:none;color:var(--text);padding:13px 14px;font-size:13.5px;}
  textarea{resize:none;min-height:66px;line-height:1.5;}
  .field-hint{font-size:11.5px;color:var(--text-faint);margin-top:6px;}

  .btn{width:100%;padding:15px;border-radius:100px;font-size:14.5px;font-weight:700;border:none;background:var(--disabled-bg);color:var(--disabled-text);transition:all .15s ease;}
  .btn.enabled{background:var(--green);color:#fff;box-shadow:0 8px 18px -6px rgba(18,102,79,.45);}
  .btn.enabled:hover{background:var(--green-dark);}
  .btn.enabled:active{transform:scale(.985);}
  .btn-outline{background:var(--white);border:1.5px solid var(--line);color:var(--text);}
  .btn-row{display:flex;gap:10px;}
  .btn-row .btn{flex:1;}

  .prev-card{border:2px solid var(--r1-bg);border-radius:16px;padding:14px 15px;margin-bottom:20px;background:var(--white);}
  .preview-caption{font-size:12px;color:var(--text-faint);margin-bottom:10px;}

  .amount-panel{background:var(--bg);border-radius:14px;padding:16px;margin-bottom:8px;}
  .amount-panel-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;}
  .amount-panel-head span{font-size:13px;font-weight:700;color:var(--text-soft);}
  .amount-panel-head .range{font-size:11.5px;color:var(--text-faint);}
  .stepper-row{display:flex;align-items:center;justify-content:space-between;}
  .stepper-row .amt{font-size:24px;font-weight:800;color:var(--green);}
  .stepper-note{font-size:12.5px;color:var(--text-soft);text-align:center;margin:14px 0 18px;}
  .stepper-note b{color:var(--green);}

  .slot-picker{display:flex;gap:8px;margin-bottom:16px;overflow-x:auto;}
  .slot-chip{flex:none;min-width:70px;padding:10px 6px;border-radius:12px;text-align:center;border:1.5px solid var(--line);}
  .slot-chip .r{font-weight:800;font-size:13.5px;margin-bottom:2px;}
  .slot-chip .p{font-size:10.5px;color:var(--text-faint);}
  .slot-chip.active{border-color:var(--green);background:var(--green-tint);}
  .slot-chip.active .r{color:var(--green);}

  /* confirm bottom sheet (dimmed overlay) */
  .dim-overlay{position:fixed;inset:0;background:rgba(20,23,26,.4);z-index:60;display:flex;align-items:flex-end;justify-content:center;animation:fadeIn .18s ease;}
  @media (min-width:640px){.dim-overlay{align-items:center;}}
  .sheet{width:100%;max-width:520px;background:var(--white);border-radius:22px 22px 0 0;padding:24px 22px 26px;box-shadow:var(--shadow-sheet);animation:slideUp .22s cubic-bezier(.2,.8,.2,1);}
  @media (min-width:640px){.sheet{border-radius:22px;}}
  @keyframes slideUp{from{transform:translateY(30px);opacity:0}to{transform:translateY(0);opacity:1}}
  .sheet h2{font-size:19px;font-weight:800;line-height:1.35;margin-bottom:16px;}
  .sheet h2 .g{color:var(--green);}
  .check-row{display:flex;gap:11px;align-items:flex-start;margin-bottom:18px;border:1.5px solid var(--line);padding:13px 14px;border-radius:14px;}
  .check-row input{margin-top:2px;flex:none;width:17px;height:17px;accent-color:var(--green);}
  .check-row label{font-size:12.5px;color:var(--text-soft);line-height:1.5;}
  .check-row a{color:var(--green);font-weight:600;text-decoration:underline;}
  .sheet-cancel{display:block;text-align:center;font-size:13.5px;color:var(--text-faint);font-weight:600;margin-top:14px;padding:6px;}

  /* checkout page */
  .network-badge{display:inline-flex;align-items:center;gap:7px;background:#FCEEDD;color:#8A4B00;font-size:14.5px;font-weight:800;padding:9px 16px;border-radius:11px;margin:0 auto 16px;border:1.5px solid #F0B23D;}
  .network-badge svg{width:16px;height:16px;flex:none;}
  .network-row{display:flex;justify-content:center;}
  .qr-box{background:var(--white);border:1.5px solid var(--line);padding:14px;border-radius:16px;width:176px;height:176px;margin:4px auto 18px;display:flex;align-items:center;justify-content:center;}
  .qr-box canvas,.qr-box img{width:100% !important;height:100% !important;}
  .amount-big{text-align:center;margin-bottom:14px;}
  .amount-big .n{font-family:'IBM Plex Mono',monospace;font-size:27px;font-weight:600;color:var(--green);}
  .amount-big .c{font-size:12px;color:var(--text-faint);display:block;margin-top:3px;}
  .warn-note{font-size:12px;color:#A05A0C;background:#FCEEDD;border-radius:12px;padding:11px 13px;text-align:center;margin-bottom:16px;line-height:1.5;font-weight:500;}
  .wallet-label{font-size:12px;font-weight:800;color:var(--text-soft);text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px;text-align:left;}
  .wallet-box{display:flex;align-items:center;gap:10px;background:var(--bg);border:1.5px solid var(--r1-bg);border-radius:12px;padding:14px;margin-bottom:16px;}
  .wallet-addr{flex:1;font-family:'IBM Plex Mono',monospace;font-size:15px;font-weight:700;color:var(--text);word-break:break-all;line-height:1.5;}
  .copy-btn{flex:none;width:38px;height:38px;border-radius:10px;background:var(--white);border:1.5px solid var(--line);display:flex;align-items:center;justify-content:center;color:var(--text);}
  .copy-btn svg{width:16px;height:16px;}
  .copy-btn.copied{color:var(--green);border-color:var(--green);}
  .timer-box{text-align:center;margin-bottom:18px;}
  .timer-box .t{font-family:'IBM Plex Mono',monospace;font-size:25px;font-weight:600;}
  .timer-box .l{font-size:11px;color:var(--text-faint);text-transform:uppercase;letter-spacing:.06em;margin-top:2px;font-weight:600;}
  .waiting-box{text-align:center;padding:14px 0 6px;}
  .spinner{width:32px;height:32px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--green);margin:0 auto 14px;animation:spin .9s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg)}}

</style>

const PLATFORM_ICON = { instagram:'instagram', x:'x', youtube:'youtube', link:'link' };

/* ============================================================
   CONEXIÓN AL BACKEND
   Si deployaste cima-backend en Vercel, pegá esa URL acá abajo
   (sin barra al final), ej: 'https://cima-backend.vercel.app'.
   Si dejás '' y este html vive DENTRO de ese mismo proyecto
   (carpeta /public), los fetch funcionan igual con ruta relativa.
   ============================================================ */
const API_BASE = '';
const WALLET_ADDRESS = 'TXn9ZqP4mKk2vRw8fLc3sYb7hJd5uNa1Qe'; // wallet USDT TRC20 real

async function apiFetch(path, opts){
  const res = await fetch(API_BASE + path, {
    headers: { 'Content-Type': 'application/json' },
    ...opts,
  });
  const data = await res.json().catch(()=>({}));
  if(!res.ok) throw new Error(data.error || 'Error de conexión con el backend');
  return data;
}

function emptyPosition(rank){
  return { rank, occupied:false, name:null, desc:null, platform:null, url:null, cta:null,
    price:null, paidAt:null, protectedHoursLeft:0, minToDisplace: starts[rank], startPrice: starts[rank],
    locked:false, lockStatus:null };
}

function agoLabel(paidAtMs){
  if(!paidAtMs) return '';
  const h = (Date.now() - Number(paidAtMs)) / 3600000;
  if(h < 1) return 'recién';
  if(h < 24) return `hace ${Math.floor(h)} h`;
  return `hace ${Math.floor(h/24)} d`;
}

const increments = {1:2, 2:1.5, 3:1, 4:0.75, 5:0.5};
const starts = {1:3, 2:2, 3:1.5, 4:1, 5:0.5};

// Arranca sin nada — los 5 puestos se muestran "libres" hasta que loadPositions()
// traiga el estado real del backend (o hasta que alguien los compre de verdad).
let projects = [1,2,3,4,5].map(emptyPosition);

// "También publicados" (#6+) todavía no tiene backend propio — arranca vacío también.

/* NOTA: "others" (#6 en adelante) sigue siendo mock — el backend actual solo
   maneja los 5 puestos pagos del top. Cuando sumemos la sección de "listado
   libre" del prompt original, esto se conecta igual que loadPositions(). */
async function loadPositions(){
  try{
    const data = await apiFetch('/api/positions');
    if(data && Array.isArray(data.positions)){
      projects = data.positions.map(p => ({
        ...p,
        ago: p.paidAt ? agoLabel(p.paidAt) : null,
        clicks: p.clicks ?? (p.price ? Math.round(p.price * 13) + 24 : 0),
      }));
    }
    if(typeof data.totalPublished === 'number'){
      totalPublished = data.totalPublished;
    }
  } catch(err){
    console.warn('No se pudo cargar el estado real de los puestos:', err.message);
  }
}

let watching = 14;
// Arranca en 0 y se va rellenando solo con publicaciones reales confirmadas
// (lo trae loadPositions() del backend) — nada de números inventados.
let totalPublished = 0;
let timeFilter = 'historico';
let showAllPositions = false;

let state = {
  view: 'landing',
  wizard: { platform:'instagram', handle:'', title:'', desc:'', btnText:'', slot:1, bid: starts[1] },
  showConfirm: false,
  reservation: null
};

function minToDisplace(p){ return Math.round((p.price + increments[p.rank])*100)/100; }
function fmt(n){ return n.toLocaleString('es-AR',{minimumFractionDigits:2, maximumFractionDigits:2}); }
function fmt6(n){ return n.toFixed(6); }
function esc(s){ return (s||'').replace(/[&<>"']/g, c=>({'&':'&lt;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]||c)); }
function domainFor(platform){ return platform==='instagram' ? 'instagram.com/' : platform==='x' ? 'x.com/' : platform==='youtube' ? 'youtube.com/@' : ''; }
function destinationUrl(p){
  if(!p.url) return '#';
  if(/^https?:\/\//i.test(p.url)) return p.url;
  return `https://${domainFor(p.platform)}${p.url}`;
}

function statusTag(p){
  if(p.protectedHoursLeft > 24){
    return `<div class="status-tag status-protected">Protegido · ${Math.round(p.protectedHoursLeft)}h restantes</div>`;
  } else if(p.protectedHoursLeft > 0){
    const h = Math.floor(p.protectedHoursLeft), m = Math.round((p.protectedHoursLeft-h)*60);
    return `<div class="status-tag status-soon">Disponible en ${h}h ${m}m</div>`;
  } else {
    const price = p.minToDisplace ?? minToDisplace(p);
    return `<button class="displace-btn" style="background:var(--r${p.rank}-tint);color:var(--r${p.rank})" data-open-slot="${p.rank}">Desplazar por $${fmt(price)} ${ICONS.arrow}</button>`;
  }
}

    </div>
  </div>`;
}

      <h3 style="margin-bottom:8px;">Estás en la cola</h3>

        El puesto #${r.slot} está en disputa ahora mismo. Sos el <b>#${r.queuePosition}</b> en la fila —
        si la reserva actual vence sin que paguen, te ofrecemos el turno automáticamente, al mismo precio.
      </div>
      <button class="btn btn-outline" data-action="close-wizard">Volver al ranking</button>
    </div>
    ${footerMini()}`;
  }

        <div class="spinner"></div>

        <div style="font-size:13px;color:var(--text-soft);line-height:1.6;max-width:340px;margin:0 auto;">
          Avisamos apenas veamos el pago de <b class="mono">$${fmt6(r.amount)}</b> en la wallet.
        </div>
        <div style="font-size:11.5px;color:var(--text-faint);margin-top:10px;">Esta pantalla se actualiza sola, no hace falta que recargues.</div>
      </div>
      <div class="alt-label">¿Preferís avisar directo?</div>
      <div class="alt-contact">
        <a href="#" aria-label="WhatsApp">${ICONS.whatsapp}</a>
        <a href="#" aria-label="Telegram">${ICONS.telegram}</a>
        <a href="#" aria-label="Mail">${ICONS.mail}</a>
      </div>
      <button class="btn btn-outline" style="margin-top:20px;" data-action="close-wizard">Volver al ranking</button>

    ${footerMini()}`;

  return `
  ${wizTopbar('close-confirm-2')}
  ${wizHead('Pagá para confirmar', 'Puesto #' + r.slot + ' · 18 minutos para pagar', 3)}
  <div class="wiz-card fade-in" style="text-align:center;">
    <div class="network-row"><div class="network-badge">${ICONS.shield} Red: USDT · TRC20 (Tron)</div></div>
    <div class="qr-box" id="qr-container"></div>
    <div class="amount-big"><span class="n">$${fmt6(r.amount)}</span><span class="c">monto exacto con decimales</span></div>
    <div class="warn-note">Enviá el monto EXACTO con los decimales, por la red TRC20 (Tron) — así identificamos tu pago automáticamente, sin memo.</div>
    <div class="wallet-label">Dirección de pago · TRC20</div>
    <div class="wallet-box">
      <span class="wallet-addr" id="wallet-addr">${WALLET_ADDRESS}</span>
      <button class="copy-btn" id="copy-wallet-btn">${ICONS.copy}</button>
    </div>
    <div class="timer-box"><div class="t mono" id="timer-display">18:00</div><div class="l">tiempo para pagar</div></div>
    <button class="btn enabled" id="paid-btn">Ya pagué</button>
    <div class="alt-label">¿Preferís avisar directo?</div>
    <div class="alt-contact">
      <a href="#" aria-label="WhatsApp">${ICONS.whatsapp}</a>
      <a href="#" aria-label="Telegram">${ICONS.telegram}</a>
      <a href="#" aria-label="Mail">${ICONS.mail}</a>
    </div>
  </div>

}

let timerInterval = null;
let waitingPollInterval = null;

function render(){
  const app = document.getElementById('app');
  if(state.view === 'landing'){
    app.innerHTML = landingHTML();
    attachLandingEvents();
    return;
  }
  if(state.view === 'w1') app.innerHTML = wizardStep1HTML();
  else if(state.view === 'w2') app.innerHTML = wizardStep2HTML();
  else if(state.view === 'w3') app.innerHTML = wizardStep3HTML();
  else if(state.view === 'checkout') app.innerHTML = checkoutHTML();
  attachWizardEvents();

  if(state.view === 'w3' && state.showConfirm){
    app.insertAdjacentHTML('beforeend', confirmSheetHTML());
    attachConfirmEvents();
  }
  if(state.view === 'checkout' && state.reservation && state.reservation.status === 'pending'){
    setupCheckout();
  }
  if(state.view === 'checkout' && state.reservation && state.reservation.status === 'waiting'){
    setupWaitingPoll();
  }
}

function closeAll(){
  clearInterval(timerInterval);
  clearInterval(waitingPollInterval);
  state.view = 'landing';
  state.showConfirm = false;
  render();
}

function attachLandingEvents(){
  document.querySelectorAll('[data-action="open-wizard"], [data-action="open-wizard-any"]').forEach(el=>{
    el.addEventListener('click', (e)=>{
      e.preventDefault();
      const slot = parseInt(el.getAttribute('data-slot')) || 1;
      state.wizard = { platform:'instagram', handle:'', title:'', desc:'', btnText:'', slot, bid: starts[slot] };
      state.view = 'w1';
      render();
    });
  });
  document.querySelectorAll('[data-open-slot]').forEach(el=>{
    el.addEventListener('click', ()=>{
      const slot = parseInt(el.getAttribute('data-open-slot'));
      const target = projects.find(p=>p.rank===slot);
      const bid = target ? (target.minToDisplace ?? minToDisplace(target)) : starts[slot];
      state.wizard = { platform:'instagram', handle:'', title:'', desc:'', btnText:'', slot, bid };
      state.view = 'w1';
      render();
    });
  });
  document.querySelectorAll('.toggle-opt').forEach(el=>{
    el.addEventListener('click', ()=>{ timeFilter = el.getAttribute('data-filter'); render(); });
  });
  const viewAllBtn = document.getElementById('view-all-btn');
  if(viewAllBtn) viewAllBtn.addEventListener('click', ()=>{
    showAllPositions = !showAllPositions;
    render();
    if(showAllPositions){
      const head = document.getElementById('all-positions-head');
      if(head) head.scrollIntoView({behavior:'smooth', block:'start'});
    }
  });
  const p1 = projects[0];
  const nextMin = p1.minToDisplace ?? minToDisplace(p1);
  if(state.heroBid === undefined) state.heroBid = nextMin;
  const heroMinus = document.getElementById('hero-minus');
  const heroPlus = document.getElementById('hero-plus');
  function syncHero(){
    document.querySelector('.stepper-hero .amt').innerHTML = `$${fmt(state.heroBid)}<span class="cur">USDT</span>`;
    document.querySelector('.cta-primary').textContent = `Llévate el puesto #1 por $${fmt(state.heroBid)}`;
  }
  if(heroMinus) heroMinus.addEventListener('click', ()=>{ state.heroBid = Math.max(nextMin, Math.round((state.heroBid-1)*100)/100); syncHero(); });
  if(heroPlus) heroPlus.addEventListener('click', ()=>{ state.heroBid = Math.round((state.heroBid+1)*100)/100; syncHero(); });
  const ctaBtn = document.querySelector('.cta-primary');
  if(ctaBtn) ctaBtn.addEventListener('click', (e)=>{
    e.preventDefault();
    state.wizard = { platform:'instagram', handle:'', title:'', desc:'', btnText:'', slot:1, bid: state.heroBid };
    state.view = 'w1';
    render();
  });
}

function attachWizardEvents(){
  const w = state.wizard;

  document.querySelectorAll('[data-action="close-wizard"]').forEach(el=> el.addEventListener('click', closeAll));
  document.querySelectorAll('[data-action="wizard-goto-1"]').forEach(el=> el.addEventListener('click', ()=>{ state.view='w1'; render(); }));
  document.querySelectorAll('[data-action="wizard-goto-2"]').forEach(el=> el.addEventListener('click', ()=>{ state.view='w2'; render(); }));
  document.querySelectorAll('[data-action="close-confirm-2"]').forEach(el=> el.addEventListener('click', ()=>{ state.view='w3'; state.showConfirm=true; render(); }));

  document.querySelectorAll('.dest-opt').forEach(el=>{
    el.addEventListener('click', ()=>{ w.platform = el.getAttribute('data-platform'); render(); });
  });
  const handleInput = document.getElementById('handle-input');
  if(handleInput){
    handleInput.focus();
    handleInput.addEventListener('input', (e)=>{
      w.handle = e.target.value;
      const btn = document.getElementById('step1-next');
      const ready = w.platform && w.handle;
      btn.disabled = !ready;
      btn.classList.toggle('enabled', !!ready);
    });
  }
  const step1Next = document.getElementById('step1-next');
  if(step1Next) step1Next.addEventListener('click', ()=>{ if(w.platform && w.handle){ state.view='w2'; render(); } });

  const titleInput = document.getElementById('title-input');
  const descInput = document.getElementById('desc-input');
  const btnInput = document.getElementById('btn-input');
  function syncStep2(){
    if(titleInput) w.title = titleInput.value;
    if(descInput) w.desc = descInput.value;
    if(btnInput) w.btnText = btnInput.value;
    const next = document.getElementById('step2-next');
    const ready = w.title && w.desc && w.btnText;
    if(next){ next.disabled = !ready; next.classList.toggle('enabled', !!ready); }
    const counts = document.querySelectorAll('.field .count');
    const lens = [w.title.length, w.desc.length, w.btnText.length];
    const maxes = [40,110,20];
    counts.forEach((c,i)=>{ c.textContent = lens[i] + '/' + maxes[i]; });
  }
  [titleInput, descInput, btnInput].forEach(el=>{ if(el) el.addEventListener('input', syncStep2); });
  const step2Next = document.getElementById('step2-next');
  if(step2Next) step2Next.addEventListener('click', ()=>{ if(w.title && w.desc && w.btnText){ state.view='w3'; render(); } });

  document.querySelectorAll('.slot-chip').forEach(el=>{
    el.addEventListener('click', ()=>{
      w.slot = parseInt(el.getAttribute('data-slot'));
      w.bid = starts[w.slot];
      render();
    });
  });
  const bidMinus = document.getElementById('bid-minus');
  const bidPlus = document.getElementById('bid-plus');
  const step = ()=> increments[w.slot];
  function refreshBid(){ const el = document.getElementById('bid-val-wrap'); if(el) el.textContent = '$' + fmt(w.bid); }
  if(bidMinus) bidMinus.addEventListener('click', ()=>{ w.bid = Math.max(starts[w.slot], Math.round((w.bid - step())*100)/100); refreshBid(); });
  if(bidPlus) bidPlus.addEventListener('click', ()=>{ w.bid = Math.round((w.bid + step())*100)/100; refreshBid(); });
  const publishBtn = document.getElementById('publish-btn');
  if(publishBtn) publishBtn.addEventListener('click', ()=>{ state.showConfirm = true; render(); });

  const paidBtn = document.getElementById('paid-btn');
  if(paidBtn) paidBtn.addEventListener('click', async ()=>{
    paidBtn.disabled = true;
    paidBtn.textContent = 'Avisando...';
    try{
      await apiFetch(`/api/positions/${state.reservation.slot}/mark-paid`, {
        method:'POST',
        body: JSON.stringify({ reservationId: state.reservation.reservationId }),
      });
      clearInterval(timerInterval);
      state.reservation.status = 'waiting';
      render();
    } catch(err){
      showToast(err.message || 'No se pudo avisar el pago');
      paidBtn.disabled = false;
      paidBtn.textContent = 'Ya pagué';
    }
  });
}

function attachConfirmEvents(){
  const w = state.wizard;
  const overlay = document.getElementById('dim-overlay');
  overlay.addEventListener('click', (e)=>{ if(e.target === overlay){ state.showConfirm=false; render(); } });
  document.querySelectorAll('[data-action="close-confirm"]').forEach(el=> el.addEventListener('click', (e)=>{ e.preventDefault(); state.showConfirm=false; render(); }));
  const disclaimerCheck = document.getElementById('disclaimer-check');
  const goPayBtn = document.getElementById('go-pay-btn');
  disclaimerCheck.addEventListener('change', ()=>{
    goPayBtn.disabled = !disclaimerCheck.checked;
    goPayBtn.classList.toggle('enabled', disclaimerCheck.checked);
  });
  goPayBtn.addEventListener('click', async ()=>{
    if(goPayBtn.disabled) return;
    goPayBtn.disabled = true;
    goPayBtn.textContent = 'Reservando...';
    try{
      const result = await apiFetch(`/api/positions/${w.slot}/reserve`, {
        method:'POST',
        body: JSON.stringify({
          platform: w.platform, handle: w.handle, title: w.title, desc: w.desc, btnText: w.btnText,
          contact: w.handle, bid: w.bid,
        }),
      });
      if(result.status === 'queued'){
        state.reservation = { slot: w.slot, status:'queued', reservationId: result.reservationId, queuePosition: result.queuePosition };
      } else {
        state.reservation = { slot: w.slot, status:'pending', reservationId: result.reservationId, amount: result.amount, expiresAt: result.expiresAt };
      }
      state.view = 'checkout';
      state.showConfirm = false;
      render();
    } catch(err){
      showToast(err.message || 'No se pudo reservar el puesto');
      goPayBtn.disabled = false;
      goPayBtn.classList.add('enabled');
      goPayBtn.textContent = `Ir a pagar $${fmt(w.bid)}`;
    }
  });
}

function setupCheckout(){
  const r = state.reservation;
  const qrContainer = document.getElementById('qr-container');
  if(qrContainer && window.QRCode){
    qrContainer.innerHTML = '';
    new QRCode(qrContainer, { text: `tron:${WALLET_ADDRESS}?amount=${r.amount.toFixed(6)}&token=USDT`, width: 148, height: 148, colorDark: '#14171A', colorLight: '#ffffff' });
  }
  const copyBtn = document.getElementById('copy-wallet-btn');
  if(copyBtn) copyBtn.addEventListener('click', ()=>{
    navigator.clipboard && navigator.clipboard.writeText(WALLET_ADDRESS).catch(()=>{});
    copyBtn.classList.add('copied');
    copyBtn.innerHTML = ICONS.check;
    showToast('Dirección copiada');
    setTimeout(()=>{ copyBtn.classList.remove('copied'); copyBtn.innerHTML = ICONS.copy; }, 1800);
  });
  const timerDisplay = document.getElementById('timer-display');
  clearInterval(timerInterval);
  function tick(){
    // El TTL real vive en el backend (Redis); acá solo mostramos la cuenta regresiva
    // en base a expiresAt, que es lo que el servidor nos devolvió al reservar.
    const secondsLeft = r.expiresAt ? Math.max(0, Math.round((r.expiresAt - Date.now())/1000)) : 0;
    if(secondsLeft <= 0){
      clearInterval(timerInterval);
      showToast('El tiempo para pagar venció');
      closeAll();
      return;
    }
    const m = Math.floor(secondsLeft/60), s = secondsLeft%60;
    if(timerDisplay) timerDisplay.textContent = `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
  }
  tick();
  timerInterval = setInterval(tick, 1000);
}

/* Mientras el usuario está en "esperando confirmación", chequeamos cada 5s si
   el admin ya confirmó (o rechazó) SU reserva puntual — sin que tenga que
   recargar nada. Si se confirma, lo mandamos a la página principal a ver su
   puesto ya publicado. */
function setupWaitingPoll(){
  const r = state.reservation;
  clearInterval(waitingPollInterval);
  async function check(){
    try{
      const result = await apiFetch(`/api/positions/${r.slot}/status?reservationId=${encodeURIComponent(r.reservationId)}`);
      if(result.status === 'confirmed'){
        clearInterval(waitingPollInterval);
        window.location.href = '/';
      } else if(result.status === 'not_found'){
        clearInterval(waitingPollInterval);
        showToast('Tu reserva fue rechazada o venció. Podés intentar de nuevo.');
        closeAll();
      }
    } catch(err){
      // si falla una consulta puntual no pasa nada, se reintenta sola en el próximo tick
    }
  }
  check();
  waitingPollInterval = setInterval(check, 5000);
}

function showToast(msg){
  const existing = document.querySelector('.toast');
  if(existing) existing.remove();
  const t = document.createElement('div');
  t.className = 'toast';
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(()=> t.remove(), 2600);
}

setInterval(()=>{
  watching = Math.max(6, watching + (Math.random() > 0.5 ? 1 : -1));
  if(state.view === 'landing'){
    const pill = document.querySelector('.live-pill');
    if(pill) pill.innerHTML = `<span class="dot-pulse"></span><span><b>${watching}</b> mirando ahora</span>&nbsp;· <span><b>${totalPublished.toLocaleString('es-AR')}</b> en total</span>`;
  }
}, 4000);

// Refresca el estado real de los puestos cada 20s mientras estás en el landing,
// así ves si alguien más compró/desplazó un puesto sin tener que recargar.
setInterval(async ()=>{
  if(state.view === 'landing'){
    await loadPositions();
    render();
  }
}, 20000);

loadPositions().then(render);
</script>
